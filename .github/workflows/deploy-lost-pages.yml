name: Validate Lost Pages source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lost-pages-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static release candidate (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build for Website hosting
        run: npm run build:luminary
      - name: Upload candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: lost-pages-static-candidate
          path: dist/
          retention-days: 14
